name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync Cloudinary gallery
        run: |
          curl -s "https://api.cloudinary.com/v1_1/jhx7umny/resources/image?max_results=500" \
            -u "${{ secrets.CLOUDINARY_API_KEY }}:${{ secrets.CLOUDINARY_API_SECRET }}" | \
            jq -c '[.resources[].public_id]' > gallery.json

      - name: Inject YouTube API key
        run: |
          sed -i "s/YOUR_YOUTUBE_API_KEY/${{ secrets.YOUTUBE_API_KEY }}/g" script.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
