<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Images - AGC Lalwet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 2rem 1rem;
    }

    .upload-card {
      background: white;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
    }

    h2 {
      text-align: center;
      font-size: 1.3rem;
      color: #1a1a2e;
      margin-bottom: 1.5rem;
      font-family: 'Poppins', sans-serif;
    }

    .upload-area {
      border: 2px dashed #d0d0d0;
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #fafafa;
      margin-bottom: 1.5rem;
    }

    .upload-area:hover,
    .upload-area.dragover {
      border-color: #4f46e5;
      background: #f5f3ff;
    }

    .upload-area p {
      color: #888;
      font-size: 0.95rem;
    }

    .upload-area .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #aaa;
    }

    input[type="file"] {
      display: none;
    }

    button {
      width: 100%;
      padding: 0.85rem;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }

    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }

    .preview {
      margin: 1rem 0;
      display: none;
    }

    .preview img {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      border-radius: 8px;
      background: #f0f0f0;
    }

    .result {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      word-break: break-all;
    }

    .result.success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      display: block;
    }

    .result.error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      display: block;
    }

    .public-id-box {
      margin-top: 1rem;
      padding: 0.75rem;
      background: #f5f5f5;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.8rem;
      word-break: break-all;
      display: none;
    }

    .public-id-box label {
      font-weight: 600;
      font-size: 0.75rem;
      color: #555;
      display: block;
      margin-bottom: 0.25rem;
      font-family: 'Inter', sans-serif;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #888;
      text-decoration: none;
    }

    .back-link:hover { color: #4f46e5; }
  </style>
</head>
<body>

  <div class="upload-card">
    <h2>Upload to Gallery</h2>

    <div class="upload-area" id="uploadArea">
      <div class="icon">+</div>
      <p>Click to select an image or drag & drop</p>
    </div>

    <input type="file" id="fileInput" accept="image/*" />

    <div class="preview" id="preview">
      <img id="previewImage" src="" alt="Preview" />
    </div>

    <button type="button" id="uploadBtn" disabled>Upload</button>

    <div class="result" id="result"></div>
    <div class="public-id-box" id="publicIdBox">
      <label>Public ID (add this to GALLERY_IMAGE_IDS in script.js):</label>
      <code id="publicIdValue"></code>
    </div>

    <a href="/index.html" class="back-link">Back to website</a>
  </div>

  <script>
    const CLOUD_NAME = 'jhx7umny';
    const UPLOAD_PRESET = 'church_uploads';

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const previewImage = document.getElementById('previewImage');
    const uploadBtn = document.getElementById('uploadBtn');
    const result = document.getElementById('result');
    const publicIdBox = document.getElementById('publicIdBox');
    const publicIdValue = document.getElementById('publicIdValue');

    let selectedFile = null;

    uploadArea.addEventListener('click', () => fileInput.click());

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        handleFile(fileInput.files[0]);
      }
    });

    function handleFile(file) {
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImage.src = e.target.result;
        preview.style.display = 'block';
        uploadBtn.disabled = false;
        result.style.display = 'none';
        publicIdBox.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Uploading...';
      result.className = 'result';
      result.style.display = 'none';
      publicIdBox.style.display = 'none';

      const formData = new FormData();
      formData.append('file', selectedFile);
      formData.append('upload_preset', UPLOAD_PRESET);

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (res.ok && data.public_id) {
          result.className = 'result success';
          result.textContent = 'Upload successful!';
          result.style.display = 'block';

          publicIdValue.textContent = data.public_id;
          publicIdBox.style.display = 'block';

          uploadBtn.textContent = 'Upload another';
          uploadBtn.disabled = false;
          selectedFile = null;
          preview.style.display = 'none';
          fileInput.value = '';
        } else {
          throw new Error(data.error ? data.error.message : 'Upload failed');
        }
      } catch (err) {
        result.className = 'result error';
        result.textContent = 'Error: ' + err.message;
        result.style.display = 'block';
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Upload';
      }
    });
  </script>

</body>
</html>
