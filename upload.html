<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Images - AGC Lalwet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 2rem 1rem;
    }

    .upload-card {
      background: white;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 580px;
    }

    h2 {
      text-align: center;
      font-size: 1.3rem;
      color: #1a1a2e;
      margin-bottom: 1.5rem;
      font-family: 'Poppins', sans-serif;
    }

    .upload-area {
      border: 2px dashed #d0d0d0;
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #fafafa;
      margin-bottom: 1.5rem;
    }

    .upload-area:hover,
    .upload-area.dragover {
      border-color: #4f46e5;
      background: #f5f3ff;
    }

    .upload-area p {
      color: #888;
      font-size: 0.95rem;
    }

    .upload-area .count {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 0.5rem;
    }

    .upload-area .icon {
      font-size: 3rem;
      margin-bottom: 0.75rem;
      color: #aaa;
    }

    input[type="file"] { display: none; }

    button {
      width: 100%;
      padding: 0.85rem;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }

    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }

    .previews {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 0.5rem;
      margin: 1rem 0;
      display: none;
    }

    .previews.has-files { display: grid; }

    .previews .thumb {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 1;
      background: #f0f0f0;
    }

    .previews .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .previews .thumb .remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 14px;
      line-height: 22px;
      text-align: center;
      cursor: pointer;
      padding: 0;
    }

    .previews .thumb .remove:hover { background: rgba(220,38,38,0.85); }

    .progress-bar {
      height: 4px;
      background: #e5e7eb;
      border-radius: 4px;
      margin: 0.75rem 0;
      overflow: hidden;
      display: none;
    }

    .progress-bar .fill {
      height: 100%;
      width: 0%;
      background: #4f46e5;
      border-radius: 4px;
      transition: width 0.3s;
    }

    .result {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      word-break: break-all;
    }

    .result.success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      display: block;
    }

    .result.error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      display: block;
    }

    .public-ids {
      margin-top: 1rem;
      display: none;
    }

    .public-ids.visible { display: block; }

    .public-ids label {
      font-weight: 600;
      font-size: 0.75rem;
      color: #555;
      display: block;
      margin-bottom: 0.25rem;
      font-family: 'Inter', sans-serif;
    }

    .public-ids code {
      display: block;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 0.35rem 0.5rem;
      background: #f5f5f5;
      border-radius: 4px;
      margin-bottom: 0.25rem;
      word-break: break-all;
      cursor: pointer;
      transition: background 0.15s;
    }

    .public-ids code:hover { background: #e5e7eb; }

    .public-ids .copy-all {
      font-size: 0.75rem;
      color: #4f46e5;
      cursor: pointer;
      text-decoration: underline;
      display: inline-block;
      margin-top: 0.5rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      margin-left: 0.5rem;
    }

    .badge.ok { background: #bbf7d0; color: #166534; }
    .badge.fail { background: #fecaca; color: #dc2626; }
    .badge.pending { background: #fef3c7; color: #92400e; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #888;
      text-decoration: none;
    }

    .back-link:hover { color: #4f46e5; }
  </style>
</head>
<body>

  <div class="upload-card">
    <h2>Upload Images</h2>

    <div class="upload-area" id="uploadArea">
      <div class="icon">+</div>
      <p>Click to select images or drag &amp; drop (multiple allowed)</p>
      <div class="count" id="fileCount"></div>
    </div>

    <input type="file" id="fileInput" accept="image/*" multiple />

    <div class="previews" id="previews"></div>

    <div class="progress-bar" id="progressBar">
      <div class="fill" id="progressFill"></div>
    </div>

    <button type="button" id="uploadBtn" disabled>Upload</button>

    <div class="result" id="result"></div>

    <div class="public-ids" id="publicIds">
      <label>Public IDs — click to copy, or <span class="copy-all" id="copyAll">copy all</span></label>
      <div id="idList"></div>
    </div>

    <a href="/index.html" class="back-link">Back to website</a>
  </div>

  <script>
    const CLOUD_NAME = 'jhx7umny';
    const UPLOAD_PRESET = 'church_uploads';

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const previews = document.getElementById('previews');
    const uploadBtn = document.getElementById('uploadBtn');
    const result = document.getElementById('result');
    const publicIds = document.getElementById('publicIds');
    const idList = document.getElementById('idList');
    const copyAll = document.getElementById('copyAll');
    const fileCount = document.getElementById('fileCount');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');

    let files = [];

    uploadArea.addEventListener('click', () => fileInput.click());

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) addFiles(fileInput.files);
    });

    function addFiles(newFiles) {
      files = [...files, ...Array.from(newFiles)];
      renderPreviews();
      updateUI();
      fileInput.value = '';
    }

    function removeFile(i) {
      files.splice(i, 1);
      renderPreviews();
      updateUI();
    }

    function renderPreviews() {
      previews.innerHTML = '';
      if (files.length === 0) {
        previews.classList.remove('has-files');
        return;
      }
      previews.classList.add('has-files');

      files.forEach((file, i) => {
        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        const img = document.createElement('img');
        img.alt = file.name;
        const reader = new FileReader();
        reader.onload = (e) => { img.src = e.target.result; };
        reader.readAsDataURL(file);
        const rm = document.createElement('button');
        rm.className = 'remove';
        rm.textContent = '\u00d7';
        rm.type = 'button';
        rm.addEventListener('click', () => removeFile(i));
        thumb.appendChild(img);
        thumb.appendChild(rm);
        previews.appendChild(thumb);
      });
    }

    function updateUI() {
      const n = files.length;
      fileCount.textContent = n ? `${n} file${n !== 1 ? 's' : ''} selected` : '';
      uploadBtn.disabled = n === 0;
      publicIds.classList.remove('visible');
      idList.innerHTML = '';
      result.className = 'result';
      result.style.display = 'none';
    }

    uploadBtn.addEventListener('click', async () => {
      if (files.length === 0) return;

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Uploading...';
      result.className = 'result';
      result.style.display = 'none';
      publicIds.classList.remove('visible');
      idList.innerHTML = '';
      progressBar.style.display = 'block';
      progressFill.style.width = '0%';

      const uploaded = [];
      const errors = [];
      const total = files.length;

      for (let i = 0; i < total; i++) {
        const formData = new FormData();
        formData.append('file', files[i]);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (res.ok && data.public_id) {
            uploaded.push(data.public_id);
          } else {
            errors.push(`${files[i].name}: ${(data.error && data.error.message) || 'Upload failed'}`);
          }
        } catch (err) {
          errors.push(`${files[i].name}: ${err.message}`);
        }

        progressFill.style.width = `${((i + 1) / total) * 100}%`;
      }

      progressBar.style.display = 'none';

      if (uploaded.length) {
        result.className = 'result success';
        result.textContent = `${uploaded.length} of ${total} uploaded successfully.`;
        result.style.display = 'block';

        idList.innerHTML = uploaded.map(id =>
          `<code class="id-line">${id}</code>`
        ).join('');

        document.querySelectorAll('.id-line').forEach(el => {
          el.addEventListener('click', () => {
            navigator.clipboard.writeText(el.textContent).catch(() => {});
            el.style.background = '#dbeafe';
            setTimeout(() => { el.style.background = ''; }, 400);
          });
        });

        publicIds.classList.add('visible');
      }

      if (errors.length) {
        result.className = 'result error';
        result.textContent = errors.join('; ');
        result.style.display = 'block';
      }

      files = [];
      renderPreviews();
      updateUI();
      uploadBtn.textContent = 'Upload';
    });

    copyAll.addEventListener('click', () => {
      const ids = Array.from(document.querySelectorAll('.id-line')).map(el => el.textContent);
      if (ids.length) {
        navigator.clipboard.writeText(ids.join('\n')).catch(() => {});
        copyAll.textContent = 'copied!';
        setTimeout(() => { copyAll.textContent = 'copy all'; }, 1500);
      }
    });
  </script>

</body>
</html>
